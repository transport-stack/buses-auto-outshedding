<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Depot Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .header {
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 30px;
        }
        .depot-card {
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .depot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 0.8rem;
            margin-left: 5px;
        }
        .table-responsive {
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="row">
                <div class="col-md-8">
                    <h1>Automated Depot Management</h1>
                    <p class="lead">Monitor bus outshedding and inshedding times across depots</p>
                </div>
                <div class="col-md-4 text-end">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-primary" id="refreshBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                                <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                            </svg>
                            Refresh Data
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="settingsBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear" viewBox="0 0 16 16">
                                <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
                                <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
                            </svg>
                            Settings
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Date Selection</h5>
                        <div class="mb-3">
                            <label for="dateSelect" class="form-label">Select Date</label>
                            <input type="date" class="form-control" id="dateSelect">
                        </div>
                        <div class="mb-3">
                            <label for="depotSelect" class="form-label">Select Depot</label>
                            <select class="form-select" id="depotSelect">
                                <option value="">All Depots</option>
                                <!-- Depot options will be populated dynamically -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="shiftSelect" class="form-label">Select Shift</label>
                            <select class="form-select" id="shiftSelect">
                                <option value="morning">Morning</option>
                                <option value="evening">Evening</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary" id="loadDataBtn">Load Data</button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Summary</h5>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <h6 class="card-subtitle mb-2 text-muted">Total Buses</h6>
                                        <h2 id="totalBuses">-</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <h6 class="card-subtitle mb-2 text-muted">Outshed</h6>
                                        <h2 id="outshedBuses">-</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <h6 class="card-subtitle mb-2 text-muted">Inshed</h6>
                                        <h2 id="inshedBuses">-</h2>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Bus Data</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="busDataTable">
                                <thead>
                                    <tr>
                                        <th>Bus Number</th>
                                        <th>Depot</th>
                                        <th>Outshed Time</th>
                                        <th>Inshed Time</th>
                                        <th>Duration</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="busDataBody">
                                    <!-- Data will be populated dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer text-center">
            <p>Automated Depot Management System &copy; 2025</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set default date to today
            const today = new Date();
            const dateString = today.toISOString().split('T')[0];
            document.getElementById('dateSelect').value = dateString;
            
            // Load depot list
            fetch('/api/depots')
                .then(response => response.json())
                .then(data => {
                    const depotSelect = document.getElementById('depotSelect');
                    data.forEach(depot => {
                        const option = document.createElement('option');
                        option.value = depot.id;
                        option.textContent = depot.name;
                        depotSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error loading depots:', error));
            
            // Load data button click handler
            document.getElementById('loadDataBtn').addEventListener('click', loadBusData);
            
            // Refresh button click handler
            document.getElementById('refreshBtn').addEventListener('click', loadBusData);
            
            // Initial data load
            loadBusData();
            
            function loadBusData() {
                const date = document.getElementById('dateSelect').value;
                const depot = document.getElementById('depotSelect').value;
                const shift = document.getElementById('shiftSelect').value;
                
                if (!date) {
                    alert('Please select a date');
                    return;
                }
                
                const [year, month, day] = date.split('-');
                
                let url = `/api/bus_data/${year}/${month}/${day}`;
                if (depot) {
                    url += `/${depot}/${shift}`;
                }
                
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        updateBusTable(data);
                        updateSummary(data);
                    })
                    .catch(error => {
                        console.error('Error loading bus data:', error);
                        document.getElementById('busDataBody').innerHTML = 
                            '<tr><td colspan="6" class="text-center">Error loading data. Please try again.</td></tr>';
                    });
            }
            
            function updateBusTable(data) {
                const tableBody = document.getElementById('busDataBody');
                tableBody.innerHTML = '';
                
                if (!data || data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="text-center">No data available for the selected criteria</td></tr>';
                    return;
                }
                
                data.forEach(bus => {
                    const row = document.createElement('tr');
                    
                    // Calculate duration if both outshed and inshed times exist
                    let duration = '-';
                    let status = 'Unknown';
                    let statusClass = 'secondary';
                    
                    if (bus.ot && bus.it) {
                        const otTime = new Date(bus.ot.replace('/', '-'));
                        const itTime = new Date(bus.it.replace('/', '-'));
                        const diff = (itTime - otTime) / 1000 / 60; // minutes
                        duration = `${Math.floor(diff / 60)}h ${Math.floor(diff % 60)}m`;
                        status = 'Completed';
                        statusClass = 'success';
                    } else if (bus.ot && !bus.it) {
                        status = 'Out';
                        statusClass = 'warning';
                    } else if (!bus.ot && !bus.it) {
                        status = 'Not Started';
                        statusClass = 'secondary';
                    }
                    
                    row.innerHTML = `
                        <td>${bus.bus_number}</td>
                        <td>${bus.depot || '-'}</td>
                        <td>${bus.ot || '-'}</td>
                        <td>${bus.it || '-'}</td>
                        <td>${duration}</td>
                        <td><span class="badge bg-${statusClass}">${status}</span></td>
                    `;
                    
                    tableBody.appendChild(row);
                });
            }
            
            function updateSummary(data) {
                if (!data) {
                    document.getElementById('totalBuses').textContent = '0';
                    document.getElementById('outshedBuses').textContent = '0';
                    document.getElementById('inshedBuses').textContent = '0';
                    return;
                }
                
                const total = data.length;
                const outshed = data.filter(bus => bus.ot).length;
                const inshed = data.filter(bus => bus.it).length;
                
                document.getElementById('totalBuses').textContent = total;
                document.getElementById('outshedBuses').textContent = outshed;
                document.getElementById('inshedBuses').textContent = inshed;
            }
        });
    </script>
</body>
</html>
